name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SILO_IMAGE: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
  SILO_USER: s3cache
  SILO_PASSWORD: s3cache-integration-secret
  SILO_BUCKET: cache-integration

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Unit tests
        run: go test ./... -race -count=1

  test-checks: # referenced in Mergify conditions, must stay unique across all workflows
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - run: echo "all test checks passed"

  integration:
    name: integration (Silo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Silo
        run: |
          docker run -d --name silo \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$SILO_USER" \
            -e MINIO_ROOT_PASSWORD="$SILO_PASSWORD" \
            "$SILO_IMAGE" server /data

      - name: Wait for Silo
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "silo is up"
              exit 0
            fi
            sleep 2
          done
          echo "silo did not become ready in time"
          docker logs silo
          exit 1

      - name: Create test bucket
        run: |
          docker exec silo mcli alias set local http://127.0.0.1:9000 "$SILO_USER" "$SILO_PASSWORD"
          docker exec silo mcli mb --ignore-existing "local/$SILO_BUCKET"

      - name: Integration tests
        env:
          S3CACHE_TEST_S3: s3://cache-integration/ci
          S3CACHE_TEST_ENDPOINT: http://127.0.0.1:9000
          S3CACHE_TEST_ACCESS_KEY: ${{ env.SILO_USER }}
          S3CACHE_TEST_SECRET_KEY: ${{ env.SILO_PASSWORD }}
        run: go test ./... -run Integration -v -count=1

      - name: CLI smoke test
        env:
          S3CACHE_S3: s3://cache-integration/ci
          S3CACHE_ENDPOINT_URL: http://127.0.0.1:9000
          S3CACHE_KEY: smoke-${{ github.run_id }}
          S3CACHE_ACCESS_KEY: ${{ env.SILO_USER }}
          S3CACHE_SECRET_KEY: ${{ env.SILO_PASSWORD }}
        run: |
          go build -o /tmp/s3cache ./cmd/s3cache
          mkdir -p /tmp/smoke/deps
          echo hello > /tmp/smoke/deps/file.txt

          /tmp/s3cache save --path /tmp/smoke
          rm -rf /tmp/smoke
          /tmp/s3cache restore
          test "$(cat /tmp/smoke/deps/file.txt)" = hello

      - name: Silo logs
        if: failure()
        run: docker logs silo || true

      - name: Stop Silo
        if: always()
        run: docker rm -f silo || true

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -trimpath -o /dev/null ./cmd/s3cache

  build-checks: # referenced in Mergify conditions, must stay unique across all workflows
    needs: [build]
    runs-on: ubuntu-slim
    steps:
      - run: echo "all build checks passed"
